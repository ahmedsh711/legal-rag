# lint -> test (coverage gate in pyproject.toml) -> ragas-smoke + image (pushed on main only).
# monitoring-config runs in parallel. Branch protection on main requires these checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ahmedshobaki/legal-rag-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check src tests loadtest
      - name: Ruff format check
        run: uv run ruff format --check src tests loadtest

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config + rule unit tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0 test rules /etc/prometheus/tests/alerts_test.yml
      - name: amtool check-config
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.1 check-config /etc/alertmanager/alertmanager.yml

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked, with eval and monitoring groups)
        run: uv sync --locked --group eval --group monitoring
      - name: Tests with coverage gate
        run: uv run pytest

  # RAGAS gate on 10 frozen golden questions (faithfulness >= 0.75, gold citation >= 0.8).
  # Uses free-tier quota: on PRs it runs only when answer-affecting files change; always on main.
  ragas-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the PR base commit is needed for the diff below
      - name: Did anything that changes answers change?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # files that can change an answer or its score
          pattern='^(src/legalrag/(generation|pipeline|guardrails|retrieval|settings)\.py|src/legalrag/eval/.*\.py|data/golden/smoke\.jsonl|pyproject\.toml|uv\.lock|\.github/workflows/ci\.yml)$'
          if git diff --name-only "$BASE" HEAD | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No prompt/generation change: smoke gate not needed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.run == 'true'
        with:
          enable-cache: true
      - name: Install
        if: steps.changed.outputs.run == 'true'
        run: uv sync --locked --group eval
      - name: RAGAS smoke gate
        if: steps.changed.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_BACKEND: gemini
          GEMINI_MODEL: gemini-3.1-flash-lite
          JUDGE_BACKEND: gemini
          JUDGE_MODEL: gemini-3.1-flash-lite
          LLM_RPM: "12" # free tier allows 15/min
          JUDGE_RPM: "12"
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not available: cannot measure, failing closed"
            exit 1
          fi
          uv run python -m legalrag.eval.smoke
      - name: Keep the answers and scores
        if: always() && steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ragas-smoke
          path: reports/eval/smoke/
          if-no-files-found: ignore

  # Built on every run so a broken Dockerfile fails the PR. On main, the tested image is pushed
  # as sha-<commit> (immutable) and latest.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Short commit id
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image imports the app (no model, no index needed)
        run: |
          docker run --rm --entrypoint python "$IMAGE:sha-${{ steps.sha.outputs.short }}" \
            -c "import legalrag.api.main as m; print('app ok:', m.app.title)"
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ahmedshobaki
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push sha-<commit> and latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:sha-${{ steps.sha.outputs.short }}"
          docker push "$IMAGE:latest"
