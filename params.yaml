# Parameters tracked by DVC: changing one re-runs only the stages that use it.
corpus:
  expected_articles: 1149   # the Egyptian Civil Code has 1,149 articles
  max_chars_ar: 1800        # ~1.25x the longest measured Arabic article (1,419)
  max_chars_en: 2700        # ~1.25x the longest measured English article (2,141)
  length_ratio: [0.9, 2.8]  # English/Arabic chars; measured p0.5 = 0.98, p99.5 = 2.59

  # regression checks: each article must still contain its phrase after any parser change
  pinned:
    1: "تسرى النصوص التشريعية"
    89: "يتم العقد بمجرد أن يتبادل طرفان"
    147: "العقد شريعة المتعاقدين"
    374: "خمس عشرة سنة"
    418: "أن ينقل للمشتري"
    802: "لمالك الشيء وحده"
    1030: "الرهن الرسمي عقد"
    1149: "للشركاء الذين اقتسموا"
  book_starts:
    89: "الكتاب الأول"
    418: "الكتاب الثاني"
    802: "الكتاب الثالث"
    1030: "الكتاب الرابع"

  # known defects in the source PDF, flagged on the record rather than fixed silently.
  # `allow`: checks downgraded to warnings for that article; `flag`: copied onto the record.
  known_anomalies:
    1022:
      reason: "the PDF prints Article 1022's Arabic inside Article 1021's Arabic block"
      flag: arabic_text_inside_article_1021
      allow: [empty_ar]
    1021:
      reason: "its Arabic block also contains the Arabic of Article 1022"
      flag: contains_arabic_of_article_1022
      allow: [length_ratio]
    970:
      reason: "the Arabic includes later amendments (state property) that the English translation lacks"
      flag: arabic_newer_than_english
      allow: [length_ratio]
    519:
      reason: "the PDF's Arabic is one sentence; the English translation has three"
      flag: arabic_shorter_than_english
      allow: [length_ratio]
    1060:
      reason: "the PDF's Arabic has one paragraph; the English has two (the second is scrambled)"
      flag: arabic_shorter_than_english
      allow: [length_ratio]

# Index build (src/legalrag/index/build.py). Changing any of these builds a new collection.
index:
  embedding_model: BAAI/bge-m3
  embedding_revision: 9a0624b896d81da7492a910ffa53731274b6cf3d  # pinned commit (safetensors); same weights on every rebuild
  max_length: 1024          # tokens per text; the longest article is ~600 tokens
  batch_size: 16
  alias: articles
