[project]
name = "legalrag"
version = "0.1.0"
description = "Arabic Legal Q&A RAG (JEV-RAG) over the Egyptian Civil Code - MLOps Practitioner final project, Track B"
readme = "README.md"
authors = [
    { name = "Ahmed Al-Shobaki", email = "ahmedelshobakey711@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "httpx>=0.28.1",
    "langfuse==4.15.6",
    "openai>=1.60",
    "prometheus-client>=0.21",
    "pydantic>=2",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19",
    "redis>=5",
    "structlog>=25.5.0",
    "torch>=2.14.1",
    "transformers>=4.44,<6",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "dvc[s3]>=3.67.1",
    "fakeredis[lua]>=2.39.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
eval = [
    "langchain-community==0.4.1",
    "mlflow==3.17.0",
    "ragas==0.4.3",
]
load = [
    "locust>=2.37",
]
monitoring = [
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
system-certs = true

# --- Lint / format: one tool (Ruff) replaces flake8 + isort + black (course session 2) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"  # DVC hashes raw bytes of source deps: CRLF on Windows = "changed" on Linux

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "T20"]  # T20 = no print() in src (course rule)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]

# --- Tests: coverage gate enforced here so CI and local runs agree (course: >=80%) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/legalrag --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[tool.coverage.run]
branch = true
source = ["src/legalrag"]

# torch from PyTorch's CPU-only index: the default Linux wheel bundles CUDA (~2.5 GB) and would
# bloat the API image. The GPU belongs to vLLM; embeddings run on CPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
