[project]
name = "legalrag"
version = "0.1.0"
description = "Arabic Legal Q&A RAG (JEV-RAG) over the Egyptian Civil Code - MLOps Practitioner final project, Track B"
readme = "README.md"
authors = [
    { name = "Ahmed Al-Shobaki", email = "ahmedelshobakey711@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "dvc[s3]>=3.67.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
system-certs = true

# --- Lint / format: one tool (Ruff) replaces flake8 + isort + black (course session 2) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "T20"]  # T20 = no print() in src (course rule)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]

# --- Tests: coverage gate enforced here so CI and local runs agree (course: >=80%) ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/legalrag --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/legalrag"]
