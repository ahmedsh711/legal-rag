# Corpus and index pipeline: parse -> validate -> index.
# uv.lock is a dependency because a pypdf upgrade can change the extracted text.
stages:
  parse:
    cmd: uv run python -m legalrag.ingest.parse --pdf data/raw/egyptian_civil_code.pdf --out data/processed/articles.json --params params.yaml
    deps:
      - data/raw/egyptian_civil_code.pdf
      - src/legalrag/ingest
      - src/legalrag/__init__.py
      - src/legalrag/settings.py
      - src/legalrag/logging_conf.py
      - uv.lock
    params:
      - corpus.known_anomalies
    outs:
      - data/processed/articles.json
      - data/processed/articles.meta.json

  validate:
    cmd: uv run python -m legalrag.ingest.validate --articles data/processed/articles.json --params params.yaml --metrics metrics/corpus.json
    deps:
      - data/processed/articles.json
      - src/legalrag/ingest
      - uv.lock
    params:
      - corpus
    metrics:
      - metrics/corpus.json:
          cache: false

  index:
    # embeds every article with bge-m3 into Qdrant; needs the qdrant service running
    # always_changed: the real output lives in Qdrant, which DVC cannot track. The build reuses
    # an identical existing collection, so an unchanged repro takes seconds.
    always_changed: true
    cmd: uv run python -m legalrag.index.build --articles data/processed/articles.json --params params.yaml --manifest data/processed/index_manifest.json --metrics metrics/index.json
    deps:
      - data/processed/articles.json
      - metrics/corpus.json   # runs only after `validate` passed: never embed an invalid corpus
      - src/legalrag/index
      - uv.lock
    params:
      - index
    outs:
      - data/processed/index_manifest.json:
          cache: false
    metrics:
      - metrics/index.json:
          cache: false
