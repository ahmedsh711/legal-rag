# Reproducible corpus pipeline. `dvc repro` re-runs only stages whose deps/params changed.
# uv.lock is a dependency on purpose: a pypdf upgrade can change extraction, so it must rebuild.
# Later phases add: index (embed -> Qdrant) and evaluate (golden set -> RAGAS -> MLflow).
stages:
  parse:
    cmd: uv run python -m legalrag.ingest.parse --pdf data/raw/egyptian_civil_code.pdf --out data/processed/articles.json --params params.yaml
    deps:
      - data/raw/egyptian_civil_code.pdf
      - src/legalrag/ingest
      - src/legalrag/__init__.py
      - src/legalrag/settings.py
      - src/legalrag/logging_conf.py
      - uv.lock
    params:
      - corpus.known_anomalies
    outs:
      - data/processed/articles.json
      - data/processed/articles.meta.json

  validate:
    cmd: uv run python -m legalrag.ingest.validate --articles data/processed/articles.json --params params.yaml --metrics reports/corpus_metrics.json
    deps:
      - data/processed/articles.json
      - src/legalrag/ingest
      - uv.lock
    params:
      - corpus
    metrics:
      - reports/corpus_metrics.json:
          cache: false

  index:
    # embeds every article with bge-m3 and loads it into Qdrant (needs: docker compose --profile core up -d qdrant)
    # always_changed: the real output lives in Qdrant, which DVC cannot see (fresh clone, wiped
    # volume). The stage runs on every repro; the build reuses an existing identical collection
    # in seconds and only embeds when it is missing.
    always_changed: true
    cmd: uv run python -m legalrag.index.build --articles data/processed/articles.json --params params.yaml --manifest data/processed/index_manifest.json --metrics reports/index_metrics.json
    deps:
      - data/processed/articles.json
      - reports/corpus_metrics.json   # runs only after `validate` passed: never embed an invalid corpus
      - src/legalrag/index
      - uv.lock
    params:
      - index
    outs:
      - data/processed/index_manifest.json:
          cache: false
    metrics:
      - reports/index_metrics.json:
          cache: false
