# Grafana reads this at start-up: data sources are configuration in git, not clicks in a UI.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s # = scrape interval, so rate() windows are never too short
  - name: Drift history
    uid: drift-db
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: $POSTGRES_USER
    jsonData:
      database: monitoring
      sslmode: disable
    secureJsonData:
      password: $POSTGRES_PASSWORD
  - name: Logs
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      # a trace_id inside a log line becomes a link to that request's trace in Langfuse
      derivedFields:
        - name: Langfuse trace
          matcherRegex: '"trace_id": "([0-9a-f]+)"'
          url: "http://127.0.0.1:3000/project/legal-rag/traces/$${__value.raw}"
          urlDisplayLabel: Open trace in Langfuse
