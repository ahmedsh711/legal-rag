# Load every dashboard JSON from the folder mounted at /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: legal-rag
    folder: legal-rag
    type: file
    disableDeletion: true # the file in git is the source of truth
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
