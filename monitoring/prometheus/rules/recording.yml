# Recording rules: expensive queries computed once every 15 s and stored as new series.
# Dashboards and alerts read these, so they all agree on the definition (one formula, one place).
groups:
  - name: rag-recording
    rules:
      - record: rag:request_rate:5m
        expr: sum by (endpoint, status) (rate(rag_requests_total[5m]))

      - record: rag:ask_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_request_seconds_bucket{endpoint="ask"}[5m])))

      - record: rag:stage_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le, stage) (rate(rag_stage_seconds_bucket[5m])))

      - record: rag:ttft_p95:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_ttft_seconds_bucket[5m])))

      # error ratio over two windows: the SLO burn-rate alert needs both
      - record: rag:ask_error_ratio:5m
        expr: |
          sum(rate(rag_requests_total{endpoint="ask", status=~"5.."}[5m]))
          / clamp_min(sum(rate(rag_requests_total{endpoint="ask"}[5m])), 1e-9)
      - record: rag:ask_error_ratio:1h
        expr: |
          sum(rate(rag_requests_total{endpoint="ask", status=~"5.."}[1h]))
          / clamp_min(sum(rate(rag_requests_total{endpoint="ask"}[1h])), 1e-9)
      - record: rag:ask_error_ratio:30m
        expr: |
          sum(rate(rag_requests_total{endpoint="ask", status=~"5.."}[30m]))
          / clamp_min(sum(rate(rag_requests_total{endpoint="ask"}[30m])), 1e-9)
      - record: rag:ask_error_ratio:6h
        expr: |
          sum(rate(rag_requests_total{endpoint="ask", status=~"5.."}[6h]))
          / clamp_min(sum(rate(rag_requests_total{endpoint="ask"}[6h])), 1e-9)

      - record: rag:refusal_ratio:15m
        expr: |
          sum(rate(rag_answers_total{outcome="refused"}[15m]))
          / clamp_min(sum(rate(rag_answers_total[15m])), 1e-9)

      - record: rag:tokens:1h
        expr: sum by (backend, type) (increase(rag_llm_tokens_total[1h]))
