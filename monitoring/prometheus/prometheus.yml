# Retention (15d) is set on the command line in docker/compose.yaml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: legal-rag

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # FastAPI app: rag_* metrics
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: legal-rag-api

  # vLLM engine metrics; the target is down unless the llm profile is running
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
    metric_relabel_configs:
      - source_labels: [__name__] # keep only the series used by the dashboard and alerts
        regex: "vllm:(num_requests_running|num_requests_waiting|kv_cache_usage_perc|prompt_tokens_total|generation_tokens_total|time_to_first_token_seconds_.*|e2e_request_latency_seconds_.*|prefix_cache_.*)"
        action: keep

  # host metrics (Docker Desktop VM) plus *.prom files written by the batch jobs (eval, drift)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # per-container CPU/memory, limited to legal-rag-* containers
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|network_.*_bytes_total|last_seen)"
        action: keep
      - source_labels: [name]
        regex: "legal-rag-.+"
        action: keep

  # External /health probe: the app can expose /metrics and still fail requests.
  # Relabelling passes the URL to the blackbox exporter as ?target= and keeps it as `instance`.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
