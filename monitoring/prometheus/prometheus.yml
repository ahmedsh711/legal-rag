# Prometheus pulls ("scrapes") every target's /metrics every 15 s and keeps the numbers 15 days.
# Hand-written on purpose: every job here is something we decided to watch.
global:
  scrape_interval: 15s
  evaluation_interval: 15s # how often recording and alerting rules run
  external_labels:
    project: legal-rag

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # our FastAPI service: the metric contract in reports/module-5.md
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: legal-rag-api

  # vLLM's own metrics (queue, KV cache, tokens/s); only up when the `llm` profile runs
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
    metric_relabel_configs:
      - source_labels: [__name__] # keep the vLLM series we chart and alert on, drop the rest
        regex: "vllm:(num_requests_running|num_requests_waiting|kv_cache_usage_perc|prompt_tokens_total|generation_tokens_total|time_to_first_token_seconds_.*|e2e_request_latency_seconds_.*|prefix_cache_.*)"
        action: keep

  # the machine (here: Docker Desktop's Linux VM): CPU, memory, disk; plus the textfile
  # collector, where batch jobs (nightly evaluation, drift) leave their latest numbers
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # per-container CPU / memory; only our containers, the rest of the machine is not our budget
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|memory_working_set_bytes|network_.*_bytes_total|last_seen)"
        action: keep
      - source_labels: [name]
        regex: "legal-rag-.+"
        action: keep

  # a synthetic user: is /health answering from outside the app? (the app can be "up" for
  # Prometheus and still unreachable for people). Relabelling turns the target into a parameter
  # of the blackbox exporter, which does the HTTP call and reports probe_success.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
