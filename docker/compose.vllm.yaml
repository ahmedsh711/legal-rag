# Generate with the local vLLM server instead of a hosted API. Retrieval, decider and guards
# are unchanged.
#   docker compose --env-file .env -f docker/compose.yaml -f docker/compose.vllm.yaml \
#     --profile core --profile llm up -d
services:
  api:
    environment:
      LLM_BACKEND: vllm
    depends_on:
      vllm:
        condition: service_healthy
