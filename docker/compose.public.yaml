# Expose the API to the Streamlit Community Cloud UI through an ngrok tunnel.
#   docker compose --env-file .env -f docker/compose.yaml -f docker/compose.public.yaml \
#     --profile core --profile public up -d
# Needs NGROK_AUTHTOKEN, NGROK_DOMAIN (the free static domain of your ngrok account) and
# UI_API_KEY in .env. The API then answers only requests that carry UI_API_KEY.

services:
  api:
    environment:
      REQUIRE_API_KEY: "true"  # pragma: allowlist secret
      API_KEYS: ${UI_API_KEY:?set UI_API_KEY in .env}

  tunnel:
    image: ngrok/ngrok:3.39.11-alpine
    profiles: [public]
    # NGROK_CRL_NOVERIFY=true skips the certificate revocation check, for networks where the
    # agent cannot download ngrok's CRL ("failed to fetch CRL")
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf 'version: 3\nagent:\n  crl_noverify: %s\n' "$${NGROK_CRL_NOVERIFY}" > /tmp/ngrok.yml &&
        exec ngrok http api:8000 --url="$${NGROK_DOMAIN}" --config /tmp/ngrok.yml --log stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
      NGROK_DOMAIN: ${NGROK_DOMAIN:?set NGROK_DOMAIN in .env}
      NGROK_CRL_NOVERIFY: ${NGROK_CRL_NOVERIFY:-false}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
