# One compose file, many profiles, so the laptop only runs what the current phase needs.
#   docker compose -f docker/compose.yaml --profile core up -d
# Profiles: core | tracking | llm | monitoring | llm-observability | airflow | serving
# Services are added phase by phase (see task_plan.md). Phase 4: llm (vLLM on the GPU);
# Phase 5: monitoring (Prometheus, Alertmanager, Grafana, exporters).
name: legal-rag

services:
  # ---------- core: what /ask needs ----------
  # Ports are published on 127.0.0.1 only: these services have no auth (or dev passwords), so
  # nobody else on the Wi-Fi should reach them. Containers talk to each other by service name.
  qdrant:
    image: qdrant/qdrant:v1.19.2  # keep within one minor version of qdrant-client in uv.lock
    profiles: [core]
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:  # the image has bash but no curl: "is the port accepting connections?"
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: [redis_data:/data]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      secrets: [local_ca]
    image: ${DOCKERHUB_USER:-ahmedshobaki}/legal-rag-api:${API_TAG:-dev}
    profiles: [core]
    env_file:
      - path: ../.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0  # rate-limit buckets
      VLLM_BASE_URL: http://vllm:8000/v1
      FEEDBACK_PATH: /app/feedback/feedback.jsonl
      # CONFIG_SOURCE=mlflow (in .env): runtime knobs from models:/legal-rag-config@production
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # bge-m3 (~2.3 GB) is downloaded once into this volume, not baked into the image.
      # (A Windows bind mount was tried: it appears as root:root 755 inside the container,
      # so the non-root app user cannot write the model there.)
      - hf_cache:/home/app/.cache/huggingface
      - feedback:/app/feedback
      # only on machines with HTTPS inspection: LOCAL_CA_CERT=<path to root CA pem> in .env
      - ${LOCAL_CA_CERT:-./no-local-ca.pem}:/run/local-ca.pem:ro
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]  # port 8000 taken on your machine? set API_HOST_PORT
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ---------- tracking: MLflow + DVC remote (Phase 1/3) ----------
  postgres:
    image: postgres:17-alpine
    profiles: [tracking, llm-observability, airflow]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mlflow
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible object store: DVC remote, MLflow artifacts, Langfuse events.
  # MinIO withdrew its community images from Docker Hub in 2025; this is the frozen Bitnami
  # build of MinIO (fine for local dev). Production would use AWS S3 or a maintained store.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    profiles: [tracking, llm-observability]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: dvc,mlflow,langfuse
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Experiment tracking + model registry. Runs/params/metrics in Postgres, artifacts in MinIO.
  # The server proxies artifacts (--serve-artifacts is the default), so clients only need
  # MLFLOW_TRACKING_URI; the S3 credentials stay here. "-full" = Postgres + S3 drivers included.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0-full
    profiles: [tracking]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-legalrag}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow
      # MLflow rejects unknown Host headers (DNS-rebinding protection); allow our names
      - --allowed-hosts=mlflow:5000,localhost:5000,127.0.0.1:5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------- llm: our own model server on the GPU (Phase 4) ----------
  # vLLM speaks the OpenAI API, so the app switches to it with LLM_BACKEND=vllm and nothing else.
  # Sized for a 4 GB laptop GPU (RTX 3050): Qwen2.5-1.5B-Instruct with 4-bit AWQ weights,
  # 78 % of VRAM (Windows keeps part of it for the desktop), a 4,096-token window (our longest
  # prompt is 1,896 Qwen tokens + up to 800 answer tokens) and at most 8 sequences decoded together.
  vllm:
    image: vllm/vllm-openai:v0.30.0
    profiles: [llm]
    # same start-up script as the API: trusts a local HTTPS-inspection CA if one is mounted,
    # then runs the image's own command (`vllm serve ...`)
    entrypoint: ["sh", "/usr/local/bin/ca-entrypoint.sh", "vllm", "serve"]
    environment:
      HF_HUB_DISABLE_XET: "1"  # plain HTTPS download, so the trusted bundle above applies
    command:
      - --model=Qwen/Qwen2.5-1.5B-Instruct-AWQ
      - --revision=3ecffa0ceb27851800f45519bab9c457a04405e1  # pinned, like bge-m3
      - --tokenizer-revision=3ecffa0ceb27851800f45519bab9c457a04405e1
      - --quantization=awq_marlin  # Marlin kernels: fast 4-bit matmul on Ampere (sm_86)
      - --gpu-memory-utilization=0.78
      - --max-model-len=4096
      - --max-num-seqs=8
      - --host=0.0.0.0
      - --port=8000
    volumes:
      - vllm_cache:/root/.cache/huggingface  # ~1.1 GB of weights, downloaded once
      - ./entrypoint.sh:/usr/local/bin/ca-entrypoint.sh:ro
      - ${LOCAL_CA_CERT:-./no-local-ca.pem}:/run/local-ca.pem:ro
    ports: ["127.0.0.1:8001:8000"]
    shm_size: 1gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:  # /health is 200 once the weights are loaded and CUDA graphs are captured
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  # ---------- monitoring: metrics, dashboards, alerts (Phase 5) ----------
  # Prometheus pulls /metrics from the API, vLLM, the exporters; Alertmanager routes the alerts
  # its rules fire; Grafana draws it all from files in monitoring/ (nothing configured by hand).
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle  # POST /-/reload after editing rules, no restart
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: [monitoring]
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes: [../monitoring/alertmanager:/etc/alertmanager:ro]
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped

  # stands in for Slack/Discord: records every alert delivery (monitoring/alerts/alerts.jsonl)
  alert-sink:
    image: python:3.12-slim
    profiles: [monitoring]
    command: [python, /app/alert_sink.py]
    environment:
      ALERT_LOG: /data/alerts.jsonl
    volumes:
      - ../monitoring/alert_sink.py:/app/alert_sink.py:ro
      - ../monitoring/alerts:/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # read-only viewers without a login, on localhost only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/legal-rag.json
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]  # 3000 is kept for Langfuse
    depends_on: [prometheus]
    restart: unless-stopped

  # the machine (Docker Desktop's Linux VM) + the textfile collector: batch jobs (nightly
  # evaluation, drift) leave their last numbers as *.prom files in monitoring/textfile
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    command: [--collector.textfile.directory=/textfile]
    volumes: [../monitoring/textfile:/textfile:ro]
    restart: unless-stopped

  # per-container CPU and memory; needs read access to the host's cgroups and Docker state
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [monitoring]
    privileged: true  # reads /dev/kmsg and cgroup stats; local-only, no published port
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  # a synthetic user that calls /health from outside the app (relabelled in prometheus.yml)
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [monitoring]
    restart: unless-stopped

secrets:
  local_ca:
    file: ${LOCAL_CA_CERT:-./no-local-ca.pem}

volumes:
  hf_cache:
  feedback:
  qdrant_data:
  redis_data:
  postgres_data:
  minio_data:
  vllm_cache:
  prometheus_data:
  grafana_data:
