# One compose file, many profiles, so the laptop only runs what the current phase needs.
#   docker compose -f docker/compose.yaml --profile core up -d
# Profiles: core | tracking | llm | monitoring | llm-observability | airflow | serving
# Services are added phase by phase (see task_plan.md); this is the Phase 0 skeleton.
name: legal-rag

services:
  # ---------- core: what /ask needs ----------
  qdrant:
    image: qdrant/qdrant:v1.16.1
    profiles: [core]
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: [redis_data:/data]
    restart: unless-stopped

  # api service is added in Phase 2 (needs the Dockerfile)

  # ---------- tracking: MLflow + DVC remote (Phase 1/3) ----------
  postgres:
    image: postgres:17-alpine
    profiles: [tracking, llm-observability, airflow]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: mlflow
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible object store: DVC remote, MLflow artifacts, Langfuse events.
  # MinIO withdrew its community images from Docker Hub in 2025; this is the frozen Bitnami
  # build of MinIO (fine for local dev). Production would use AWS S3 or a maintained store.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    profiles: [tracking, llm-observability]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-too}
      MINIO_DEFAULT_BUCKETS: dvc,mlflow,langfuse
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  minio_data:
