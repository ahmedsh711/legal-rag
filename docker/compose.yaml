# One compose file, many profiles, so the laptop only runs what the current phase needs.
#   docker compose -f docker/compose.yaml --profile core up -d
# Profiles: core | tracking | llm | monitoring | llm-observability | airflow | serving
# Services are added phase by phase (see task_plan.md); this is the Phase 0 skeleton.
name: legal-rag

services:
  # ---------- core: what /ask needs ----------
  # Ports are published on 127.0.0.1 only: these services have no auth (or dev passwords), so
  # nobody else on the Wi-Fi should reach them. Containers talk to each other by service name.
  qdrant:
    image: qdrant/qdrant:v1.16.1
    profiles: [core]
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:  # the image has bash but no curl: "is the port accepting connections?"
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes: [redis_data:/data]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      secrets: [local_ca]
    image: ${DOCKERHUB_USER:-ahmedshobaki}/legal-rag-api:${API_TAG:-dev}
    profiles: [core]
    env_file:
      - path: ../.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      VLLM_BASE_URL: http://vllm:8000/v1
      FEEDBACK_PATH: /app/feedback/feedback.jsonl
    volumes:
      # bge-m3 (~2.3 GB) is downloaded once into this volume, not baked into the image.
      # HF_CACHE=<host ~/.cache/huggingface> in .env reuses the host's copy instead.
      - ${HF_CACHE:-hf_cache}:/home/app/.cache/huggingface
      - feedback:/app/feedback
      # only on machines with HTTPS inspection: LOCAL_CA_CERT=<path to root CA pem> in .env
      - ${LOCAL_CA_CERT:-./no-local-ca.pem}:/run/local-ca.pem:ro
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ---------- tracking: MLflow + DVC remote (Phase 1/3) ----------
  postgres:
    image: postgres:17-alpine
    profiles: [tracking, llm-observability, airflow]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mlflow
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible object store: DVC remote, MLflow artifacts, Langfuse events.
  # MinIO withdrew its community images from Docker Hub in 2025; this is the frozen Bitnami
  # build of MinIO (fine for local dev). Production would use AWS S3 or a maintained store.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    profiles: [tracking, llm-observability]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: dvc,mlflow,langfuse
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

secrets:
  local_ca:
    file: ${LOCAL_CA_CERT:-./no-local-ca.pem}

volumes:
  hf_cache:
  feedback:
  qdrant_data:
  redis_data:
  postgres_data:
  minio_data:
