# Load-test settings for the API (used together with compose.vllm.yaml):
#   export LOADTEST_API_KEYS=$(seq -f "loadtest-%g" 1 100 | paste -sd, -)
#   docker compose --env-file .env -f docker/compose.yaml -f docker/compose.vllm.yaml \
#     -f docker/compose.loadtest.yaml --profile core --profile llm up -d
# - config from env, not the registry, so the test does not depend on the MLflow server;
# - dense retrieval as in production, but no Jev decider: the test measures OUR stack (API, bge-m3,
#   Qdrant, Redis, vLLM), not a third-party API's rate limits, and spends no money;
# - the rate limit stays on: each Locust user sends one of these issued keys, like real clients.
services:
  api:
    environment:
      CONFIG_SOURCE: env
      RETRIEVAL_MODE: dense
      DECIDER_BACKEND: none
      API_KEYS: ${LOADTEST_API_KEYS:?export LOADTEST_API_KEYS (see the comment at the top)}
