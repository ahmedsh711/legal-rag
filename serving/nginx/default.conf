# Front door for releases: a weighted split between the stable and canary API
# (release/split.conf, written by `python -m legalrag.release`).

include /etc/nginx/release/split.conf;

# Docker's DNS, re-read every 10 s: a recreated API container gets a new IP, and an address
# resolved once at startup would send traffic to whichever container inherits the old one
resolver 127.0.0.11 valid=10s ipv6=off;

# a client may pin a side for testing: X-Release: stable | canary
map $http_x_release $target {
    stable  stable;
    canary  canary;
    default $release;
}

upstream stable {
    zone stable 64k;
    server api:8000 resolve;
    keepalive 16;
}

upstream canary {
    zone canary 64k;
    server api-canary:8000 resolve;
    keepalive 16;
}

server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    add_header X-Release $target always;

    location = /ask {
        proxy_buffering off;  # Server-Sent Events
        proxy_read_timeout 120s;
        proxy_pass http://$target;
    }

    location / {
        proxy_pass http://$target;
    }
}
