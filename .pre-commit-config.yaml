# Runs on `git commit`. Pin revs so the whole team formats identically (course session 2).
# "The hook is a convenience, the CI workflow is the guarantee" (GitHub Actions deck).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # lock files and DVC pointers hold content hashes, which look random but are not secrets
        exclude: ^(uv\.lock|dvc\.lock|.*\.dvc|docs/research/.*)$
